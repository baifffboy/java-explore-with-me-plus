version: '1.0'

services:
  stats-server:
    build:
      context: ewm-stats-service
      dockerfile: Dockerfile
    container_name: ewm-stats-service
    restart: always
    ports:
      - "${STATS_SERVER_HOST_PORT}:${STATS_SERVER_CONTAINER_PORT}"
    depends_on:
      stats-db:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=${STATS_DB_URL}
      - SPRING_DATASOURCE_USERNAME=${STATS_DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${STATS_DB_PASSWORD}

  stats-db:
    image: postgres:16.1
    container_name: stats-postgres
    restart: on-failure
    ports:
      - "${STATS_DB_HOST_PORT}:${STATS_DB_CONTAINER_PORT}"
    environment:
      - POSTGRES_PASSWORD=${STATS_POSTGRES_PASSWORD}
      - POSTGRES_USER=${STATS_POSTGRES_USER}
      - POSTGRES_DB=${STATS_POSTGRES_DB}
    healthcheck:
      test: pg_isready -q -d $$POSTGRES_DB -U $$POSTGRES_USER
      timeout: 5s
      interval: 5s
      retries: 10

  ewm-service:
    build:
      context: ewm-main-service
      dockerfile: Dockerfile
    container_name: ewm-main-service
    restart: always
    ports:
      - "${EWM_SERVICE_HOST_PORT}:${EWM_SERVICE_CONTAINER_PORT}"
    depends_on:
      ewm-db:
        condition: service_healthy
      stats-server:
        condition: service_started
    environment:
      - SPRING_DATASOURCE_URL=${EWM_DB_URL}
      - SPRING_DATASOURCE_USERNAME=${EWM_DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${EWM_DB_PASSWORD}
      - STATS_SERVER_URL=${STATS_SERVER_URL}

  ewm-db:
    image: postgres:16.1
    container_name: main-postgres
    restart: on-failure
    ports:
      - "${EWM_DB_HOST_PORT}:${EWM_DB_CONTAINER_PORT}"
    environment:
      - POSTGRES_PASSWORD=${EWM_POSTGRES_PASSWORD}
      - POSTGRES_USER=${EWM_POSTGRES_USER}
      - POSTGRES_DB=${EWM_POSTGRES_DB}
    healthcheck:
      test: pg_isready -q -d $$POSTGRES_DB -U $$POSTGRES_USER
      timeout: 5s
      interval: 5s
      retries: 10